[package]
name = "shelf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "shelf_cli"
path = "src/lib.rs"

[[bin]]
name = "shelf"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde_json.workspace = true
shelf-client.workspace = true
shelf-core.workspace = true
shelf-keystore.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
shelfd = { path = "../shelfd" }
tempfile = "3.23.0"
