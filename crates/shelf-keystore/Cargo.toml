[package]
name = "shelf-keystore"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
blake3.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
ml-kem.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
shelf-core.workspace = true
shelf-protocol.workspace = true
shelf-store.workspace = true
thiserror.workspace = true
x25519-dalek.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
] }

# iOS-only: ~thin Security.framework wrapper (MIT OR Apache-2.0). Not linked on
# linux/macOS/Windows CI. Remove this target-dep and the ios cfg blocks in
# platform.rs to drop Keychain wrap (passphrase remains).
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.23.0"
